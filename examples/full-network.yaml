# A whole small network in one file: VLANs, an edge router, a branch office over
# a point-to-point radio link, a second office over IPsec, a WireGuard VPN for phones,
# access points, an extender, and monitoring for everything.
#
#   vlantool validate examples/full-network.yaml
#   vlantool generate examples/full-network.yaml -o out/
#   vlantool monitor  examples/full-network.yaml          # dashboard on http://127.0.0.1:8080/monitor

monitoring:
  interval: 30
  ssh_stats_every: 300
  # webhook: https://hooks.slack.com/services/...      # optional alert destinations
  # telegram: {token: "123456:ABC...", chat_id: "987654321"}

# Security: network devices send logs to Wazuh, firewalls run IPS, PCs get the Wazuh EDR agent
security:
  siem: 192.168.99.50
  wazuh:
    manager: 192.168.99.50
    active_response: true
    api: {url: "https://192.168.99.50:55000", user: wazuh-wui, password_env: WAZUH_API_PASSWORD}

endpoints:
  - {name: reception-pc, os: windows}
  - {name: file-server,  os: ubuntu}
  - {name: design-mac,   os: macos, arch: arm64}

vlans:
  - {id: 10, name: USERS,   gateway: 192.168.10.1/24}
  - {id: 20, name: GUEST,   gateway: 192.168.20.1/24}
  - {id: 30, name: CAMERAS, gateway: 192.168.30.1/24}
  - {id: 99, name: MGMT,    gateway: 192.168.99.1/24}
  - {id: 50, name: BRANCH,  gateway: 192.168.50.1/24}
  - {id: 60, name: OFFICE2, gateway: 10.60.0.1/24}
  - {id: 70, name: DMZ,     gateway: 192.168.70.1/24}   # public-facing servers

devices:
  # Edge router: internet, NAT, DHCP, firewall, VPN, and the AP radios
  - name: hap
    vendor: mikrotik_routeros
    host: 192.168.88.1
    username: admin
    bridge: bridge
    create_bridge: false
    vlans: [10, 20, 30, 70, 99]
    routing: [10, 20, 30, 70, 99]
    access:
      ether4: USERS
      ether2: DMZ
    trunks:
      ether5: {allowed: [10, 20, 30, 99], native: 99}   # to the office switch
    router:
      hostname: hap-edge
      wan: {interface: ether1, mode: dhcp}
      dns: [1.1.1.1, 8.8.8.8]
      dhcp_server: all
      isolate: [GUEST, CAMERAS]
      dmz: [DMZ]                       # servers here face the internet but can't touch the LAN
      port_forwards:
        - {name: web,  proto: tcp, port: 443, to: 192.168.70.10}   # public web server in the DMZ
        - {name: nvr,  proto: tcp, port: 8443, to: 192.168.30.10, to_port: 443}
      ntp: [pool.ntp.org]
    vpn:
      wireguard:
        address: 10.100.0.1/24
        port: 51820
        endpoint: myhome.ddns.net
        full_tunnel: true
        peers:
          - name: phone
          - name: laptop
      ipsec:
        - name: office2
          peer: 198.51.100.7
          psk: change-this-shared-secret
          local: [192.168.10.0/24]
          remote: [10.60.0.0/24]
    security:
      ips: prevent            # brute-force + port-scan banning on RouterOS
    filtering:                # block sites for specific devices by MAC address
      - name: kids-tablet
        mac: AA:BB:CC:DD:EE:01
        vlan: USERS
        categories: [adult, gambling]
        schedule: {days: [mon,tue,wed,thu,fri], from: "22:00", to: "06:30"}
    wireless:
      country: kenya
      ssids:
        - {ssid: Home,  passphrase: "home-passphrase-123", vlan: USERS, band: both}
        - {ssid: Guest, passphrase: "guest-pass-2024",     vlan: GUEST, band: 2ghz}
    billing:                  # optional: sell internet by voucher (hotspot) and subscription (PPPoE)
      hotspot:
        interface: GUEST      # captive portal on the guest VLAN
        dns_name: login.hotspot
        plans:
          - {name: 1hour, rate: "5M/5M",   session: 1h, shared: 1, price: 50}
          - {name: 1day,  rate: "10M/10M", session: 1d, price: 200}
        vouchers:
          - {plan: 1hour, count: 10}        # 10 printable one-hour codes
          - {plan: 1day,  count: 5}
      pppoe:                  # subscriber connections with per-plan speed limits
        interface: ether3
        service: pppoe-isp
        pool: 10.80.0.2-10.80.0.254
        gateway: 10.80.0.1
        dns: [1.1.1.1, 8.8.8.8]
        plans:
          - {name: home-10m, rate: "10M/10M", price: 1500}
          - {name: home-20m, rate: "20M/20M", price: 2500}
        subscribers:
          - {user: sub001, plan: home-10m}
          - {user: sub002, plan: home-20m}

  # Office switch fed by the hAP trunk
  - name: office-switch
    vendor: tplink_jetstream
    host: 192.168.99.2
    vlans: [10, 20, 30, 99]
    access:
      1/0/1-16: USERS
      1/0/17-20: CAMERAS
    trunks:
      1/0/24: {allowed: [10, 20, 30, 99], native: 99}

  # Branch office router across the radio link; it uses home's internet
  - name: branch-router
    vendor: vyos
    host: 10.255.0.2
    vlans: [50]
    parent_interface: eth1
    routing: [50]
    router:
      dhcp_server: [50]
      dns: [192.168.10.1]
      static_routes:
        - {to: 0.0.0.0/0, via: 10.255.0.1}

  # Second office reached over the internet with IPsec
  - name: office2-fw
    vendor: fortinet
    host: 10.60.0.1
    vlans: [60]
    parent_interface: port2
    routing: [60]
    router:
      wan: {interface: wan1, mode: static, address: 198.51.100.7/29, gateway: 198.51.100.1}
      dns: [1.1.1.1, 8.8.8.8]
      dhcp_server: [60]
    security:
      ips: prevent            # FortiGate IPS sensor on every policy
    vpn:
      ipsec:
        - name: home
          peer: 203.0.113.10
          psk: change-this-shared-secret
          local: [10.60.0.0/24]
          remote: [192.168.10.0/24]

  # The two radios of the point-to-point link (managed via their web page)
  - name: ptp-radio-home
    vendor: generic
    host: 192.168.99.20
  - name: ptp-radio-branch
    vendor: generic
    host: 192.168.99.21

  # OpenWrt access point upstairs, SSIDs on VLANs
  - name: upstairs-ap
    vendor: openwrt
    host: 192.168.99.30
    username: root
    vlans: [10, 20, 99]
    trunks:
      lan1: {allowed: all, native: 99}
    mgmt: {vlan: MGMT, address: 192.168.99.30/24}
    wireless:
      country_code: KE
      ssids:
        - {ssid: Home,  passphrase: "home-passphrase-123", vlan: USERS}
        - {ssid: Guest, passphrase: "guest-pass-2024",     vlan: GUEST, band: 2ghz}

  # Wi-Fi extender in the garden (routed repeater)
  - name: garden-extender
    vendor: openwrt
    host: 192.168.10.40
    username: root
    vlans: []
    wireless:
      country_code: KE
      mode: extender
      uplink: {ssid: Home, passphrase: "home-passphrase-123", band: 5ghz}
      ssids:
        - {ssid: Home-Garden, passphrase: "home-passphrase-123", band: 2ghz}

  # A UniFi AP managed by its controller: we print the steps and watch it
  - name: lobby-unifi-ap
    vendor: generic
    host: 192.168.99.31
    wireless:
      ssids:
        - {ssid: Home, passphrase: "home-passphrase-123", vlan: USERS}

links:
  - name: branch
    a: {device: hap, interface: ether3, address: 10.255.0.1/30}
    b: {device: branch-router, interface: eth2, address: 10.255.0.2/30}
    routing: static
