# Define every VLAN once. Each device below gets config in its own vendor syntax.
vlans:
  - id: 10
    name: USERS
    gateway: 192.168.10.1/24      # optional: makes the VLAN routable
    dhcp_relay: 10.0.99.5         # optional: forward DHCP to a server
  - id: 20
    name: VOICE
    gateway: 192.168.20.1/24
    dhcp_relay: 10.0.99.5
  - id: 30
    name: CAMERAS
    gateway: 192.168.30.1/24
  - id: 40
    name: GUEST
    gateway: 192.168.40.1/24
  - id: 99
    name: MGMT
    gateway: 10.0.99.1/24

devices:
  # Layer 3 core switch: routes between VLANs with SVIs
  - name: core-sw1
    vendor: cisco_ios
    host: 10.0.99.2
    username: admin
    routing: [10, 20, 99]          # 'all', a list, or omit for layer 2 only
    access:
      Gi1/0/1-12: USERS            # ranges and VLAN names or ids both work
      Gi1/0/13-20: 20
    trunks:
      Gi1/0/48:
        allowed: all
        native: 99

  # Access switches of different brands, layer 2 only
  - name: floor2-tplink
    vendor: tplink_jetstream
    host: 10.0.99.3
    access:
      1/0/1-8: 10
      1/0/9-12: 30
    trunks:
      1/0/24: {allowed: [10, 20, 30, 99], native: 99}

  - name: floor3-dlink
    vendor: dlink
    host: 10.0.99.4
    access:
      1-8: 10
    trunks:
      "24": {allowed: all, native: 99}

  - name: lab-mikrotik
    vendor: mikrotik_routeros
    host: 10.0.99.5
    vlans: [10, 99]
    access:
      ether2-4: 10
    trunks:
      sfp-sfpplus1: {allowed: [10, 99], native: 99}

  - name: office-smart-switch
    vendor: web_gui                # no CLI: prints a membership table to click through
    access:
      "1-4": 10
      "5": 30
    trunks:
      "8": {allowed: all, native: 99}

  # Firewall that routes CAMERAS and GUEST (router-on-a-stick) and controls traffic between them
  - name: edge-fw
    vendor: fortinet
    host: 10.0.99.254
    parent_interface: port2
    vlans: [30, 40]
    routing: [30, 40]
    policies:
      - {from: CAMERAS, to: GUEST, action: deny}
      - {from: GUEST, to: CAMERAS, action: deny}
