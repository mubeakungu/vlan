[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vlantool"
version = "0.1.0"
description = "Define VLANs once and generate config for any switch, router or firewall"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
push = ["netmiko>=4.3"]
dev = ["pytest"]

[project.scripts]
vlantool = "vlantool.cli:main"

[tool.setuptools.packages.find]
include = ["vlantool*"]

[tool.setuptools.package-data]
"vlantool.web" = ["index.html", "monitor.html"]
