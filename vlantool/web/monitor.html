<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Monitor</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --line: #dde1e8; --accent: #2f6fde;
  --up: #12b76a; --down: #f04438; --degraded: #f79009; --unknown: #98a2b3;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111418; --panel: #1a1e24; --text: #e6e8ec; --muted: #98a2b3; --line: #2c323b; --accent: #5b8ff0; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
header { display: flex; gap: 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; flex: 1; }
header a { color: var(--accent); text-decoration: none; }
main { padding: 16px; max-width: 1300px; margin: 0 auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.tile .n { font-size: 26px; font-weight: 600; }
.tile .l { color: var(--muted); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; border-left: 4px solid var(--unknown); }
.card.up { border-left-color: var(--up); } .card.down { border-left-color: var(--down); } .card.degraded { border-left-color: var(--degraded); }
.card h3 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; color: #fff; background: var(--unknown); text-transform: uppercase; }
.badge.up { background: var(--up); } .badge.down { background: var(--down); } .badge.degraded { background: var(--degraded); }
.meta { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0 0 8px; font-size: 12px; }
dt { color: var(--muted); } dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
svg { width: 100%; height: 36px; display: block; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 16px; }
section h2 { font-size: 14px; margin: 0 0 8px; }
.ev { font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
.ev time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); }
.err { color: var(--down); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 4px 6px; }
td { padding: 5px 6px; border-top: 1px solid var(--line); }
.tablewrap { overflow-x: auto; }
.btn { font: inherit; font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--accent); cursor: pointer; }
.btn:disabled { opacity: .5; cursor: default; }
.speedrow { display: flex; gap: 24px; flex-wrap: wrap; align-items: baseline; }
.speedrow .big { font-size: 30px; font-weight: 600; } .speedrow .u { color: var(--muted); font-size: 13px; }
.rate { font-variant-numeric: tabular-nums; }
.tag { font-size: 10px; text-transform: uppercase; padding: 0 5px; border-radius: 8px; background: var(--line); color: var(--muted); }
.tag.wifi { background: var(--accent); color: #fff; }
section h2 .btn { float: right; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.chart h3 { font-size: 13px; margin: 0 0 2px; font-weight: 600; }
.chart .legend { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
.chart .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: baseline; }
.chart svg { height: 120px; }
.chart .cur { float: right; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Network Monitor</h1>
  <span class="meta" id="updated"></span>
  <a href="/">Config editor</a>
</header>
<main>
  <div id="off" class="empty" hidden>Monitoring is not running. Start it with <code>vlantool monitor network.yaml</code>.</div>
  <div class="tiles" id="tiles"></div>
  <section id="speed">
    <h2>Internet speed <button id="runSpeed" class="btn">Run test</button></h2>
    <div id="speedBody" class="empty">No speed test yet.</div>
  </section>
  <section id="trends" hidden><h2>Trends</h2><div class="charts" id="trendsBody"></div></section>
  <div class="grid" id="cards"></div>
  <section id="clients" hidden><h2>Connected devices <span id="clientsCount" class="meta"></span></h2>
    <div class="tablewrap"><table id="clientsTable"></table></div></section>
  <section id="billing" hidden><h2>Hotspot &amp; subscribers <span id="billingCount" class="meta"></span></h2>
    <div id="billingBody"></div></section>
  <section id="edr" hidden><h2>Endpoints (EDR agents)</h2><div id="edrBody"></div></section>
  <section><h2>Recent alerts</h2><div id="events" class="empty">No alerts yet.</div></section>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = (t) => { if (!t) return "never"; const s = Math.round(Date.now() / 1000 - t);
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`; };
const bps = (b) => { if (b === null || b === undefined) return "-"; const u = ["bps", "Kbps", "Mbps", "Gbps"]; let i = 0;
  while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; } return `${b < 10 ? b.toFixed(1) : Math.round(b)} ${u[i]}`; };
const bytes = (b) => { if (b === null || b === undefined) return "-"; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; } return `${b < 10 ? b.toFixed(1) : Math.round(b)} ${u[i]}`; };

function spark(history) {
  if (!history.length) return "";
  const vals = history.map((h) => h[1]);
  const max = Math.max(5, ...vals.filter((v) => v !== null));
  const w = 300, h = 36, step = w / Math.max(1, history.length - 1);
  let path = "", gaps = "";
  history.forEach(([, v], i) => {
    const x = (i * step).toFixed(1);
    if (v === null) { gaps += `<rect x="${x - 1}" y="0" width="3" height="${h}" fill="var(--down)" opacity=".5"/>`; return; }
    const y = (h - 2 - (v / max) * (h - 6)).toFixed(1);
    path += (path && history[i - 1]?.[1] !== null ? "L" : "M") + `${x},${y}`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="ping history">${gaps}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

// multi-series line chart: series = [{name, color, vals:[numbers|null]}], fmt formats the y value
function linechart(title, series, fmt) {
  const n = Math.max(...series.map((s) => s.vals.length));
  if (n < 2) return "";
  const all = series.flatMap((s) => s.vals).filter((v) => v !== null && v !== undefined);
  const max = Math.max(1, ...all), w = 300, h = 120, pad = 2;
  const x = (i) => (i * w / (n - 1)).toFixed(1);
  const y = (v) => (h - pad - (v / max) * (h - 2 * pad)).toFixed(1);
  const paths = series.map((s) => {
    let d = "";
    s.vals.forEach((v, i) => { if (v === null || v === undefined) return;
      d += (d && s.vals[i - 1] != null ? "L" : "M") + `${x(i)},${y(v)}`; });
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  }).join("");
  const legend = series.map((s) => {
    const last = [...s.vals].reverse().find((v) => v !== null && v !== undefined);
    return `<span><i style="background:${s.color}"></i>${esc(s.name)} ${last != null ? esc(fmt(last)) : ""}</span>`;
  }).join("");
  return `<div class="chart"><h3>${esc(title)}<span class="cur">peak ${esc(fmt(max))}</span></h3>
    <div class="legend">${legend}</div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(title)} trend">${paths}</svg></div>`;
}

function renderTrends(t) {
  if (!t) { document.getElementById("trends").hidden = true; return; }
  const charts = [];
  const tr = t.traffic || [];
  if (tr.length >= 2)
    charts.push(linechart("Bandwidth", [
      { name: "↓ down", color: "var(--accent)", vals: tr.map((p) => p.rx_bps) },
      { name: "↑ up", color: "var(--degraded)", vals: tr.map((p) => p.tx_bps) }], bps));
  const bi = t.billing || [];
  if (bi.length >= 2 && bi.some((p) => p.hotspot || p.pppoe))
    charts.push(linechart("Users online", [
      { name: "hotspot", color: "var(--accent)", vals: bi.map((p) => p.hotspot) },
      { name: "PPPoE", color: "var(--up)", vals: bi.map((p) => p.pppoe) }], (v) => Math.round(v)));
  const sp = t.speedtest || [];
  if (sp.length >= 2)
    charts.push(linechart("Internet speed", [
      { name: "down", color: "var(--accent)", vals: sp.map((p) => p.down_mbps) },
      { name: "up", color: "var(--degraded)", vals: sp.map((p) => p.up_mbps) }], (v) => `${Math.round(v)} Mbps`));
  document.getElementById("trends").hidden = !charts.length;
  document.getElementById("trendsBody").innerHTML = charts.join("");
}

async function refresh() {
  let r;
  try { r = await (await fetch("/api/status")).json(); } catch { return; }
  document.getElementById("off").hidden = r.running;
  if (!r.running) return;
  const c = r.counts, total = r.devices.length;
  let wanRx = 0, wanTx = 0;
  r.devices.forEach((d) => Object.values(d.traffic || {}).forEach((t) => { wanRx += t.rx_bps || 0; wanTx += t.tx_bps || 0; }));
  const st = r.speedtest;
  document.getElementById("tiles").innerHTML = [
    ["Devices", total], ["Up", c.up || 0], ["Down", c.down || 0],
    ["Clients", r.clients_total ?? 0],
    ["Traffic ↓ / ↑", `${bps(wanRx)} / ${bps(wanTx)}`],
    ["Internet ↓", st && st.down_mbps !== null ? `${st.down_mbps} Mbps` : "—"],
    ...(r.billing && (r.billing.hotspot.length || r.billing.pppoe.length) ? [["Hotspot online", r.billing.online]] : []),
  ].map(([l, n]) => `<div class="tile"><div class="n" style="font-size:${String(n).length > 8 ? 17 : 26}px">${esc(n)}</div><div class="l">${l}</div></div>`).join("");

  renderTrends(r.trends);

  const order = { down: 0, degraded: 1, unknown: 2, up: 3, "no-host": 4 };
  const devices = [...r.devices].sort((a, b) => order[a.state] - order[b.state] || a.device.localeCompare(b.device));
  document.getElementById("cards").innerHTML = devices.map((d) => {
    const traf = Object.entries(d.traffic || {})
      .filter(([, t]) => t.rx_bps !== null || t.tx_bps !== null)
      .sort((a, b) => (b[1].rx_bps + b[1].tx_bps) - (a[1].rx_bps + a[1].tx_bps)).slice(0, 6);
    const rows = [
      ["Ping", d.latency_ms !== null ? `${d.latency_ms} ms` : "no reply"],
      ["Uptime 24h", d.uptime_24h !== null ? `${d.uptime_24h}%` : "-"],
      ["State since", ago(d.last_change)],
      ...Object.entries(d.stats || {}).map(([k, v]) => [k.replace("_", " "), v]),
      ...traf.map(([i, t]) => [i, `↓ ${bps(t.rx_bps)}  ↑ ${bps(t.tx_bps)}`]),
      ...Object.entries(d.ports || {}).map(([p, ok]) => [`Port ${p}`, ok ? "open" : "CLOSED"]),
    ];
    return `<div class="card ${d.state}">
      <h3><span>${esc(d.device)}</span><span class="badge ${d.state}">${esc(d.state)}</span></h3>
      <div class="meta">${esc(d.host || "no IP set")} · ${esc(d.vendor)} · checked ${ago(d.last_check)}</div>
      <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      ${d.stats_error ? `<div class="err">Stats: ${esc(d.stats_error)}</div>` : ""}
      ${spark(d.history || [])}
    </div>`;
  }).join("");

  // internet speed
  const sb = document.getElementById("speedBody");
  if (st) {
    const when = st.ts ? `tested ${ago(st.ts)}` : "";
    sb.className = "";
    sb.innerHTML = `<div class="speedrow">
      <div><div class="big rate">${st.down_mbps ?? "—"}</div><div class="u">Mbps down</div></div>
      <div><div class="big rate">${st.up_mbps ?? "—"}</div><div class="u">Mbps up</div></div>
      <div><div class="big rate">${st.ping_ms ?? "—"}</div><div class="u">ms latency</div></div>
      <div class="u">${esc(when)}</div></div>`;
  }
  document.getElementById("runSpeed").disabled = !!(st && st.running);
  if (st && st.running) sb.innerHTML += `<div class="meta">running…</div>`;

  // connected devices
  const cl = r.clients || [];
  document.getElementById("clients").hidden = !cl.length;
  document.getElementById("clientsCount").textContent = cl.length ? `(${cl.length})` : "";
  if (cl.length) {
    document.getElementById("clientsTable").innerHTML =
      `<thead><tr><th>IP</th><th>MAC</th><th>Host</th><th>VLAN / interface</th><th>Via</th><th>Seen by</th></tr></thead><tbody>` +
      cl.map((x) => `<tr><td class="rate">${esc(x.ip || "-")}</td><td class="rate">${esc(x.mac || "-")}</td>
        <td>${esc(x.host || "-")}</td><td>${esc(x.iface || "-")}</td>
        <td><span class="tag ${x.source === "wifi" ? "wifi" : ""}">${esc(x.source || "-")}</span>${x.signal ? " " + esc(x.signal) + "dBm" : ""}</td>
        <td>${esc(x.seen_by || "-")}</td></tr>`).join("") + `</tbody>`;
  }

  // hotspot & subscribers
  const bl = r.billing || { hotspot: [], pppoe: [] };
  const hasBilling = bl.hotspot.length || bl.pppoe.length;
  document.getElementById("billing").hidden = !hasBilling;
  document.getElementById("billingCount").textContent = hasBilling ? `(${bl.online} online)` : "";
  if (hasBilling) {
    let html = "";
    if (bl.hotspot.length) {
      html += `<div class="tablewrap"><table><thead><tr><th>Hotspot user</th><th>IP</th><th>MAC</th><th>Uptime</th><th>Down</th><th>Up</th><th>Router</th></tr></thead><tbody>` +
        bl.hotspot.map((u) => `<tr><td class="rate">${esc(u.user)}</td><td class="rate">${esc(u.ip || "-")}</td>
          <td class="rate">${esc(u.mac || "-")}</td><td>${esc(u.uptime || "-")}</td>
          <td class="rate">${bytes(u.in_bytes)}</td><td class="rate">${bytes(u.out_bytes)}</td><td>${esc(u.seen_by || "-")}</td></tr>`).join("") + `</tbody></table></div>`;
    }
    if (bl.pppoe.length) {
      html += `<h2 style="margin-top:12px">PPPoE subscribers online</h2><div class="tablewrap"><table><thead><tr><th>User</th><th>IP</th><th>Service</th><th>Uptime</th><th>Router</th></tr></thead><tbody>` +
        bl.pppoe.map((u) => `<tr><td class="rate">${esc(u.user)}</td><td class="rate">${esc(u.ip || "-")}</td>
          <td>${esc(u.service || "-")}</td><td>${esc(u.uptime || "-")}</td><td>${esc(u.seen_by || "-")}</td></tr>`).join("") + `</tbody></table></div>`;
    }
    document.getElementById("billingBody").innerHTML = html;
  }

  const eps = r.endpoints || [];
  document.getElementById("edr").hidden = !eps.length && !r.edr_error;
  const cls = { active: "up", disconnected: "down", never_connected: "degraded", not_enrolled: "degraded", pending: "degraded" };
  document.getElementById("edrBody").innerHTML = (r.edr_error ? `<div class="err">${esc(r.edr_error)}</div>` : "") + (eps.length ? `
    <div class="tablewrap"><table><thead><tr><th>Endpoint</th><th>Agent</th><th>IP</th><th>OS</th><th>Last seen</th></tr></thead><tbody>
    ${eps.map((a) => `<tr><td>${esc(a.name)}</td><td><span class="badge ${cls[a.status] || ""}">${esc(a.status.replace("_", " "))}</span></td>
      <td>${esc(a.ip || "-")}</td><td>${esc(a.os || "-")}</td><td>${esc(a.last_keepalive ? new Date(a.last_keepalive).toLocaleString() : "-")}</td></tr>`).join("")}
    </tbody></table></div>` : "");
  document.getElementById("events").innerHTML = r.events.length
    ? r.events.map((e) => `<div class="ev"><time>${new Date(e.ts * 1000).toLocaleString()}</time><span>${esc(e.message)}</span></div>`).join("")
    : "No alerts yet.";
  document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
}
document.getElementById("runSpeed").addEventListener("click", async (e) => {
  e.target.disabled = true;
  try { await fetch("/api/speedtest", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); } catch {}
  setTimeout(refresh, 1500);
});
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
